---
label: Article
name: article
fields:
  - type: text
    name: title
    label: Titre
    required: true
    config:
      min: 3
      max: 100
  - type: datetime
    name: date
    label: Date de publication
    required: true
    config:
      display: datetime
  - type: text
    name: categorie
    label: Catégorie
    required: true
    options:
      - Foncier agricole
      - Exploitation agricole
      - Ressources naturelles
      - Droit environnemental
      - Politique agricole
  - type: textarea
    name: resume
    label: Résumé
    required: true
    config:
      min: 10
      max: 300
      wysiwyg: false
  - type: rich_text
    name: body
    label: Contenu
    required: true
    isBody: true
    config:
      min: 50
