---
version: 0.72
auto_deploy: false
admin_path: ''
webhook_url: ''
sections:
  - type: directory
    path: content/articles
    label: Articles
    create: all
    match: '**/*.mdx'
    templates:
      - article
upload_dir: public/uploads
public_path: /uploads
front_matter_path: ''
use_front_matter_path: false
file_template: ':filename:'
instant_preview: false
build:
  instant_preview_command: npm run build
  preview_docker_image: node:16
  mount_path: /app
  working_dir: /app
  instant_preview: false
  output_directory: out
  preview_command: npm run build && npm run start
version: 0.72
